<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lclbrf — coming soon</title>
<meta name="description" content="lclbrf — hyperlocal news, briefed. Coming soon.">
<style>
  :root {
    --paper: #F2EEE4;
    --paper-raised: #FFFDF8;
    --ink: #1F2421;
    --slate: #5B6660;
    --line: #D8D0BF;
    --accent: #C65D2E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14171A;
      --paper-raised: #1B1F22;
      --ink: #ECE7DA;
      --slate: #8C948C;
      --line: #2B2F31;
      --accent: #E8834A;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    max-width: 480px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 28px;
  }
  .mark { width: 88px; height: 88px; }
  .wordmark {
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 28px;
    letter-spacing: 0.04em;
    font-weight: 600;
  }
  .wordmark .l { color: var(--accent); }
  h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 400;
    line-height: 1.4;
    text-wrap: balance;
  }
  p.sub {
    margin: 0;
    font-size: 15px;
    line-height: 1.65;
    color: var(--slate);
    max-width: 38ch;
  }
  .eyebrow {
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  form {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 360px;
    flex-wrap: wrap;
    justify-content: center;
  }
  input[type="email"] {
    flex: 1;
    min-width: 200px;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--paper-raised);
    color: var(--ink);
    font-family: Georgia, serif;
    font-size: 14px;
  }
  input[type="email"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  button {
    padding: 11px 18px;
    border: none;
    border-radius: 4px;
    background: var(--accent);
    color: var(--paper-raised);
    font-family: ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .note {
    font-size: 12px;
    color: var(--slate);
    margin: 0;
  }
  footer {
    font-family: ui-monospace, monospace;
    font-size: 11px;
    color: var(--slate);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M50 6 C26 6 10 24 10 46 C10 64 28 76 42 84 C45.5 86 47.5 88 50 94 C52.5 88 54.5 86 58 84 C72 76 90 64 90 46 C90 24 74 6 50 6 Z" fill="var(--accent)"/>
    <rect x="30" y="16" width="40" height="46" fill="var(--paper-raised)"/>
    <path d="M58 16 L70 16 L70 28 Z" fill="var(--accent)"/>
    <line x1="58" y1="16" x2="70" y2="28" stroke="var(--ink)" stroke-width="1" opacity="0.45"/>
    <rect x="36" y="30" width="26" height="6" fill="var(--ink)"/>
    <rect x="36" y="41" width="28" height="3.5" fill="var(--ink)" opacity="0.85"/>
    <rect x="36" y="49" width="28" height="3.5" fill="var(--ink)" opacity="0.85"/>
    <rect x="36" y="57" width="18" height="3.5" fill="var(--ink)" opacity="0.85"/>
  </svg>

  <span class="wordmark"><span class="l">l</span>clbrf</span>

  <div>
    <div class="eyebrow" style="margin-bottom:10px;">coming soon</div>
    <h1>The news for your block, in the time it takes to read a headline.</h1>
  </div>

  <p class="sub">lclbrf is a hyperlocal brief — council votes, road closures, market days, the stuff a wire feed skips. We're building it now.</p>

  <form action="#" method="post" onsubmit="return false;">
    <input type="email" name="email" placeholder="you@somewhere.com" required aria-label="Email address">
    <button type="submit">Notify me</button>
  </form>
  <p class="note">No spam — one email, when we launch.</p>

  <footer>lclbrf.com</footer>
</main>
</body>
</html>
